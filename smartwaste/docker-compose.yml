services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: smart, POSTGRES_PASSWORD: smart, POSTGRES_DB: smartwaste}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U smart"], interval: 5s, retries: 10}
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://smart:smart@db:5432/smartwaste
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
volumes:
  pgdata:
